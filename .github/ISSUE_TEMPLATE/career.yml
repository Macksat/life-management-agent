name: "🎯 Career — キャリア"
description: "キャリア戦略・評価・方向性。重要な判断は人間が握る。"
title: "[career] "
labels: ["category:career", "type:decision", "status:needs-triage", "priority:P2-medium"]
body:
  - type: markdown
    attributes:
      value: "キャリアの重要判断は人間が握る。AI は選択肢・トレードオフの整理まで。"
  - type: input
    id: theme
    attributes:
      label: テーマ / 問い
      placeholder: 例) 次の半年でどの専門性を深めるか
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: context(現状・きっかけ)
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: goal(どうなりたいか / 何を決めたいか)
    validations:
      required: true
  - type: input
    id: next_action
    attributes:
      label: next_action(次の一手)
      description: 例) 選択肢を 3 つ洗い出す。不明なら "clarify goal"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: notes(任意)
