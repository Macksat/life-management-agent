name: "🏠 Life Admin — 生活・事務・旅行"
description: "生活上の用事、手続き、旅行計画など。"
title: "[life] "
labels: ["category:life-admin", "type:task", "status:ready", "priority:P2-medium"]
body:
  - type: markdown
    attributes:
      value: "個人情報や機微情報は書かない。"
  - type: dropdown
    id: category
    attributes:
      label: category
      default: 0
      options:
        - life-admin
        - travel
        - health
        - relationship
        - hobby
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: goal(片付いた状態)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: context(背景・詳細)
  - type: input
    id: next_action
    attributes:
      label: next_action(次の一手)
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: due_date(期限 / YYYY-MM-DD)
  - type: dropdown
    id: priority
    attributes:
      label: priority
      default: 2
      options: ["P0-critical", "P1-high", "P2-medium", "P3-low"]
  - type: dropdown
    id: owner
    attributes:
      label: owner
      options: ["human", "ai", "both"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: notes(任意)
