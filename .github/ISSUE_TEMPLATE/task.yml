name: "✅ Task — 実行タスク"
description: "やることが決まっている実行タスク。"
title: "[task] "
labels: ["type:task", "status:ready", "priority:P2-medium"]
body:
  - type: markdown
    attributes:
      value: |
        30 分〜2 時間で終わる粒度に。大きければ project にして分解を。
        **task は「理想 / 現状 / 問題点 / 方針」の4点セットを必ず埋めること。**
  - type: dropdown
    id: category
    attributes:
      label: category
      options:
        - work
        - personal-dev
        - second-brain
        - learning
        - career
        - life-admin
        - relationship
        - travel
        - health
        - hobby
        - gadget
        - thinking
        - meta-system
    validations:
      required: true
  - type: textarea
    id: ideal
    attributes:
      label: 理想(ideal)
      description: あるべき状態 / こうなっていたい姿
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 現状(current)
      description: 今どうなっているか(事実)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題点(problem)
      description: 理想と現状のギャップ・何が困っているか
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: 方針(approach)
      description: どう埋めるか・解決の方向性
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: goal(達成したい状態 / 1 文)
    validations:
      required: true
  - type: input
    id: next_action
    attributes:
      label: next_action(次の具体的な一手)
      description: 不明なら "clarify goal"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance_criteria(完了条件 / チェックリスト)
      value: |
        - [ ]
        - [ ]
  - type: dropdown
    id: priority
    attributes:
      label: priority
      default: 2
      options: ["P0-critical", "P1-high", "P2-medium", "P3-low"]
  - type: dropdown
    id: owner
    attributes:
      label: owner
      options: ["human", "ai", "both"]
    validations:
      required: true
  - type: input
    id: due_date
    attributes:
      label: due_date(任意 / YYYY-MM-DD)
  - type: textarea
    id: related
    attributes:
      label: related_links / related_issues(任意)
  - type: textarea
    id: notes
    attributes:
      label: notes(任意)
